<div class="date-time-area">

        type="date"
        id="wedding-date"
    >


    <label for="wedding-time">
        예식 시간
    </label>

    <input
        type="time"
        id="wedding-time"
        value="12:00"
    >

</div>

                <!-- 신랑 사진 -->

                    <span class="photo-plus">＋</span>
                    <p>신부 사진</p>
                </label>

                <input
                    type="file"
                    id="bride-photo"
                    accept="image/*"
                >

              </div>

            </div>


            <!-- 청첩장 만들기 -->
            <button id="make-invitation">
                청첩장 만들기
            </button>

        </div>

                        ♥

                    <img
                        id="bride-photo-result"

        <section class="page message-page">

    </main>



    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
